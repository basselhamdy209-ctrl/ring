<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#09070d">
  <title>A Little Something ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="scene">
    <div class="eyebrow"><span class="sparkle">✦</span> MADE JUST FOR YOU <span class="sparkle">✦</span></div>
    <h1>A little <em>something</em></h1>
    <p class="intro">Some things are too special for ordinary words.</p>

    <button class="ring-stage" id="ringButton" aria-label="Tap the ring to reveal your message">
      <div class="halo halo-one"></div><div class="halo halo-two"></div>
      <div class="ring-shadow"></div>
      <div class="ring" id="ring">
        <div class="band band-back"></div>
        <div class="band band-front"></div>
        <div class="gem-setting">
          <div class="prong p1"></div><div class="prong p2"></div>
          <div class="prong p3"></div><div class="prong p4"></div>
          <div class="gem">
            <div class="gem-facet f1"></div><div class="gem-facet f2"></div>
            <div class="gem-facet f3"></div><div class="gem-facet f4"></div>
            <div class="gem-glint"></div>
          </div>
        </div>
      </div>
      <span class="tap-hint" id="tapHint">TAP THE RING</span>
    </button>

    <section class="message-card" id="messageCard" aria-live="polite">
      <div class="tiny-heart">♥</div>
      <p class="message">A little something, just for you <span>❤️</span></p>
      <p class="submessage">A small reminder that you are special.</p>
    </section>

    <div class="controls">
      <button id="motionButton" class="control-btn" type="button">Ⅱ Pause animation</button>
      <button id="sparkleButton" class="control-btn" type="button">✧ More sparkle</button>
    </div>
    <footer>ONE LITTLE GIFT · JUST BETWEEN US</footer>
  </main>
  <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
